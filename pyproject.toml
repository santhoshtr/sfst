[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sfst"
dynamic = ["version"]
description = "Python binding for SFST"
readme = "python/README.md"
license = "GPL-2.0-or-later"
authors = [{ name = "Santhosh Thottingal", email = "santhosh.thottingal@gmail.com" }]
requires-python = ">=3.10"
urls.Homepage = "https://github.com/santhoshtr/sfst"

[tool.scikit-build]
minimum-version = "build-system.requires"
build.targets = ["sfst"]
install.components = ["python"]
sdist.exclude = [".github" ]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>.+)'

[tool.cibuildwheel]
build = "cp31{0,1,2,3,4}-*"
